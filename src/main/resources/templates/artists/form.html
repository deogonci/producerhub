<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Artist | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <main>
        <h1>Add Artist</h1>

        <form th:action="@{/artists}" th:object="${artist}" method="post">
            <input type="hidden" th:field="*{id}">
            <div>
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
            </div>

            <div>
                <label for="notes">Notes</label>
                <textarea id="notes" th:field="*{notes}" rows="5"></textarea>
            </div>

            <button type="submit">Save artist</button>
            <a th:href="@{/artists}">Cancel</a>
        </form>
    </main>
</body>
</html>
