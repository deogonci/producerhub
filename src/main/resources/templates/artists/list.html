<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Artists | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main>
        <div class="page-header">
            <div><span class="eyebrow">Network / Artists</span><h1>My Artists</h1><p>Keep track of the artists you work with.</p></div>
            <a class="button" th:href="@{/artists/new}">+ Add artist</a>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(artists)}">
            <h2>No artists yet</h2><p>Save the people you collaborate with here.</p>
            <a class="button" th:href="@{/artists/new}">+ Add your first artist</a>
        </div>
        <div class="table-shell" th:unless="${#lists.isEmpty(artists)}">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Notes</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="artist : ${artists}">
                    <td th:text="${artist.name}">Artist name</td>
                    <td th:text="${artist.email}">Email</td>
                    <td th:text="${artist.notes}">Notes</td>
                    <td>
                        <a th:href="@{/artists/{id}/edit(id=${artist.id})}">Edit</a>
                        <a class="delete-link" th:href="@{/artists/{id}/delete(id=${artist.id})}">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
    </main>
</body>
</html>
