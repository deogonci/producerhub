<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Beats | ProducerHub</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <main>
        <div class="page-header">
            <div>
                <h1>My Beats</h1>
                <p>Organise and manage your beat catalogue.</p>
            </div>

            <a href="/beats/new">Add beat</a>
        </div>

        <form class="search-form" method="get" action="/beats">
            <input
                type="search"
                name="search"
                placeholder="Search by title or genre"
                th:value="${search}"
            >

            <button type="submit">Search</button>

            <a class="clear-link" href="/beats">Clear</a>
        </form>

        <p th:if="${beats.isEmpty()}">
            No beats matched your search.
        </p>

        <table th:unless="${beats.isEmpty()}">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>BPM</th>
                    <th>Key</th>
                    <th>Genre</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="beat : ${beats}">
                    <td th:text="${beat.title}">Beat title</td>
                    <td th:text="${beat.bpm}">140</td>
                    <td th:text="${beat.musicalKey}">C Minor</td>
                    <td th:text="${beat.genre}">Trap</td>
                    <td th:text="${beat.status}">AVAILABLE</td>

                    <td>
                        <a
                            class="action-link"
                            th:href="@{/beats/{id}/edit(id=${beat.id})}">
                            Edit
                        </a>

                        <a
                            class="delete-link"
                            th:href="@{/beats/{id}/delete(id=${beat.id})}">
                            Delete
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
