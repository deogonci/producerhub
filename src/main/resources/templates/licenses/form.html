<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Record Licence | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main class="form-page">
        <a class="back-link" th:href="@{/licenses}">← Back to licences</a>
        <span class="eyebrow">Business / New deal</span>
        <h1>Record Licence</h1>
        <p>Connect an artist to a beat and record what they paid.</p>
        <p class="error-message" role="alert" th:if="${error}" th:text="${error}"></p>

        <p th:if="${#lists.isEmpty(beats)}">
            Add a beat before recording a licence.
        </p>
        <p th:if="${#lists.isEmpty(artists)}">
            Add an artist before recording a licence.
        </p>

        <form class="form-card" th:if="${!#lists.isEmpty(beats) and !#lists.isEmpty(artists)}"
              th:action="@{/licenses}" method="post">

            <div>
                <label for="beatId">Beat</label>
                <select id="beatId" name="beatId" required>
                    <option value="">Choose a beat</option>
                    <option th:each="beat : ${beats}"
                            th:value="${beat.id}"
                            th:selected="${beat.id == beatId}"
                            th:text="${beat.title}">Beat title</option>
                </select>
            </div>

            <div>
                <label for="artistId">Artist</label>
                <select id="artistId" name="artistId" required>
                    <option value="">Choose an artist</option>
                    <option th:each="artist : ${artists}"
                            th:value="${artist.id}"
                            th:selected="${artist.id == artistId}"
                            th:text="${artist.name}">Artist name</option>
                </select>
            </div>

            <div>
                <label for="licenseType">Licence type</label>
                <input id="licenseType" name="licenseType"
                       type="text" placeholder="e.g. Basic or Exclusive"
                       th:value="${licenseType}" required>
            </div>

            <div>
                <label for="price">Price (€)</label>
                <input id="price" name="price" type="number"
                       min="0" step="0.01" th:value="${price}" required>
            </div>

            <div class="form-actions"><button type="submit">Save licence</button><a th:href="@{/licenses}">Cancel</a></div>
        </form>
    </main>
</body>
</html>
