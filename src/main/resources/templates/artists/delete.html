<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Artist | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main class="form-page">
        <a class="back-link" th:href="@{/artists}">← Back to artists</a>
        <span class="eyebrow">Network / Confirm action</span>
        <h1>Delete artist?</h1>
        <div class="confirm-card">
        <p th:if="${hasLicenses}">
            This artist has recorded licences. Delete those licences before deleting
            <strong th:text="${artist.name}">this artist</strong>.
        </p>

        <div th:unless="${hasLicenses}">
            <p>
                Are you sure you want to delete
                <strong th:text="${artist.name}">this artist</strong>?
            </p>

            <form th:action="@{/artists/{id}/delete(id=${artist.id})}" method="post">
                <button class="delete-button" type="submit">Yes, delete artist</button>
            </form>
        </div>

        <a class="button button-secondary" th:href="@{/artists}">Cancel</a>
        <a class="button button-secondary" th:if="${hasLicenses}" th:href="@{/licenses}">View licences</a>
        </div>
    </main>
</body>
</html>
