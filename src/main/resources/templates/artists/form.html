<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${artist.id == null ? 'Add Artist | ProducerHub' : 'Edit Artist | ProducerHub'}">Artist | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main class="form-page">
        <a class="back-link" th:href="@{/artists}">← Back to artists</a>
        <span class="eyebrow">Network / Artist details</span>
        <h1 th:text="${artist.id == null ? 'Add Artist' : 'Edit Artist'}">Artist</h1>
        <p>Keep your collaborators and their details together.</p>

        <form class="form-card" th:action="@{/artists}" th:object="${artist}" method="post">
            <input type="hidden" th:field="*{id}">
            <div>
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input id="email" type="email" th:field="*{email}">
            </div>

            <div>
                <label for="notes">Notes</label>
                <textarea id="notes" th:field="*{notes}" rows="5"></textarea>
            </div>

            <div class="form-actions"><button type="submit">Save artist</button><a th:href="@{/artists}">Cancel</a></div>
        </form>
    </main>
</body>
</html>
