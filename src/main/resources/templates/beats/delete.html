<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Beat | ProducerHub</title>

    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main class="form-page">
        <a class="back-link" href="/beats">← Back to beats</a>
        <span class="eyebrow">Catalogue / Confirm action</span>
        <h1>Delete Beat</h1>
        <div class="confirm-card">
        <p th:unless="${hasLicenses}">
            Are you sure you want to delete
            <strong th:text="${beat.title}">this beat</strong>?
        </p>

        <p th:unless="${hasLicenses}">This action cannot be undone.</p>

        <p th:if="${hasLicenses}">
            This beat has recorded licences. Delete those licences before deleting
            <strong th:text="${beat.title}">this beat</strong>.
        </p>
        <a class="button button-secondary" th:if="${hasLicenses}" th:href="@{/licenses}">View licences</a>

        <form th:unless="${hasLicenses}"
            method="post"
            th:action="@{/beats/{id}/delete(id=${beat.id})}">
            <button class="delete-button" type="submit">
                Delete beat
            </button>
            <a class="button button-secondary" th:href="@{/beats}">Cancel</a>
        </form>
        </div>
    </main>
</body>
</html>
