<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Licence | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main class="form-page">
        <a class="back-link" th:href="@{/licenses}">← Back to licences</a>
        <span class="eyebrow">Business / Confirm action</span>
        <h1>Delete licence?</h1>
        <div class="confirm-card">
        <p>
            Remove the licence for
            <strong th:text="${license.beat.title}">beat</strong>
            recorded for
            <strong th:text="${license.artist.name}">artist</strong>?
        </p>

        <form th:action="@{/licenses/{id}/delete(id=${license.id})}" method="post">
            <button class="delete-button" type="submit">Yes, delete licence</button>
            <a class="button button-secondary" th:href="@{/licenses}">Cancel</a>
        </form>
        </div>
    </main>
</body>
</html>
