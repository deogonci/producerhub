<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProducerHub</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <div th:replace="~{fragments/nav :: siteNav}"></div>
    <main>
        <header class="dashboard-hero">
            <div>
                <span class="eyebrow">Your studio / Overview</span>
                <h1>ProducerHub</h1>
                <p>Every beat, connection and licence in one place.</p>
            </div>
            <a class="button" th:href="@{/beats/new}">+ Add a beat</a>
        </header>
        <div class="section-heading">
            <h2>At a glance</h2>
            <p>Your catalogue and sales, in numbers</p>
        </div>
        <section class="stats-grid">
            <article class="stat-card accent">
                <span>Total beats</span>
                <strong th:text="${totalBeats}">0</strong>
            </article>

            <article class="stat-card">
                <span>Available</span>
                <strong th:text="${availableBeats}">0</strong>
            </article>

            <article class="stat-card">
                <span>Licensed beats</span>
                <strong th:text="${licensedBeats}">0</strong>
            </article>

            <article class="stat-card">
                <span>Sold</span>
                <strong th:text="${soldBeats}">0</strong>
            </article>

            <article class="stat-card">
                <span>Artists</span>
                <strong th:text="${artistCount}">0</strong>
            </article>

            <article class="stat-card">
                <span>Recorded licences</span>
                <strong th:text="${licenseCount}">0</strong>
            </article>

            <article class="stat-card">
                <span>Licence revenue</span>
                <strong th:text="|€${totalRevenue}|">€0</strong>
            </article>

            <article class="stat-card accent">
                <span>Payments received</span>
                <strong th:text="|€${receivedRevenue}|">€0</strong>
            </article>
            <article class="stat-card warning">
                <span>Awaiting payment</span>
                <strong th:text="|€${outstandingRevenue}|">€0</strong>
            </article>
        </section>
    </main>
</body>
</html>
