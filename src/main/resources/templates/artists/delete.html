<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Delete Artist | ProducerHub</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <main>
        <h1>Delete artist?</h1>

        <p th:if="${hasLicenses}">
            This artist has recorded licences. Delete those licences before deleting
            <strong th:text="${artist.name}">this artist</strong>.
        </p>

        <div th:unless="${hasLicenses}">
            <p>
                Are you sure you want to delete
                <strong th:text="${artist.name}">this artist</strong>?
            </p>

            <form th:action="@{/artists/{id}/delete(id=${artist.id})}" method="post">
                <button type="submit">Yes, delete artist</button>
            </form>
        </div>

        <a th:href="@{/artists}">Back to artists</a>
        <a th:if="${hasLicenses}" th:href="@{/licenses}">View licences</a>
    </main>
</body>
</html>
